footerAbout: "נובידאה היא פלטפורמת הענן המובילה לניהול סוכנויות ובתי סוכן, על בסיס Salesforce: מהליד הראשון ועד פוליסה, שירות, תביעות וחידושים, במערכת אחת. חברה גלובלית שהמטה ומרכז הפיתוח שלה כאן בישראל."
