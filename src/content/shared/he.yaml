# Shared Hebrew content. Source: "תוכן לדף אתר NOVIDEA בעברית".

# Lead banner at the bottom of every page except /contact (section "פתיחת ליד")
leadCta:
  title: "מוכנים להוביל את הסוכנות לעידן הבא?"
  body: "הצטרפו לסוכנויות המובילות בישראל, שמנהלות את תיק הלקוחות שלהן בנובידאה וצומחות איתה. השאירו פרטים, והצוות שלנו יחזור אליכם לשיחת היכרות והדגמה."
  button:
    label: "השאירו פרטים"
    href: "/contact"

# Footer blurb. Built only from the content document: "כותרת ראשית" (leading cloud platform),
# "טקסט מקוצר" (Salesforce; service, claims, renewals), /capabilities ("מליד ועד פוליסה"),
# /solution (one platform for the whole agency) and /israel (global company, HQ and R&D in Israel).
footerAbout: "נובידאה היא פלטפורמת הענן המובילה לניהול סוכנויות ביטוח ובתי סוכן, על בסיס Salesforce: מהליד הראשון ועד התביעות והחידושים, במערכת אחת. מאחוריה עומדת חברה גלובלית שהמטה ומרכז הפיתוח שלה נמצאים בישראל."
