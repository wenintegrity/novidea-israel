# SEO title and description: docs/seo.md §4.1 (approved 20/11/2026).
seo:
  title: "נובידאה | מערכת CRM בענן לסוכנויות ביטוח ובתי סוכן"
  description: "פלטפורמת ענן לניהול סוכנויות ביטוח ובתי סוכן על בסיס Salesforce: לידים, מכירות, הפקה, פרודוקציה, שירות, תביעות וחידושים במערכת אחת."

hero:
  # Source: כותרת ראשית + מסרים נוספים
  titleStrong: "נובידאה"
  titleRest: "פלטפורמת הענן המובילה לניהול סוכנויות ביטוח ובתי סוכן"
  lead: "כל עולם הביטוח הישראלי. מערכת אחת אחודה. אינסוף אפשרויות צמיחה."
  primaryCta:
    label: "השאירו פרטים"
    href: "/contact"
  secondaryCta:
    label: "למה נובידאה?"
    href: "/why-novidea"
  picture:
    src: "../../../assets/images/hero-empower-your-people.png"
    alt: "אשת מקצוע מחייכת במשרד מודרני, עם פסי המותג הצהובים של נובידאה"

sections:
  # Source: טקסט מקוצר
  - type: text
    id: overview
    surface: subtle
    paragraphs:
      - "נובידאה מובילה את המהפכה הדיגיטלית בשוק הביטוח עם פלטפורמת ענן (InsurTech) מונחית נתונים וזוכת פרסים בינלאומיים. הפלטפורמה מאיצה צמיחה, רווחיות ויעילות תפעולית עבור סוכנויות וברוקרים באמצעות כלים אנליטיים ותובנות עסקיות בזמן אמת."
      - "הפלטפורמה בנויה על תשתית ה-CRM החזקה של Salesforce ומשמשת מערכת ליבה לסוכנות: היא שמה את הלקוח במרכז ומחברת את כל תהליכי העבודה."
      - "מתיאום פגישות, מכירות, הפקה ופרודוקציה, דרך ניהול השירות ועד תביעות וחידושים: הכול במערכת אחת, כדי לתת ללקוחות שירות ברמה הגבוהה ביותר."
    # Video: src/assets/videos/Novidea-Hebrew-Israel.mp4 (78.5 s, 720p, 39 MB). No captions, at the
    # owner's request (20/11/2026). Poster: the closing "Novidea" frame.
    # TODO(verify): if the video has narration, captions are required (IS 5568 / WCAG 1.2.2).
    video:
      file: "Novidea-Hebrew-Israel.mp4"
      title: "הכירו את נובידאה"
      poster: "../../../assets/images/video-poster.png"

  # Source: טקסט מקוצר (last line)
  # Logos supplied by Novidea on 20/11/2026 (src/assets/logos/customers/). The name is the logo's alt text.
  - type: names
    id: customers
    title: "הפלטפורמה שמובילה את הסוכנויות ובתי הסוכן הגדולים בישראל"
    names:
      - name: "מבטח סימון"
        logo: "../../../assets/logos/customers/mivtach-simon.png"
      - name: "קלי"
        logo: "../../../assets/logos/customers/kali.png"
      # Alt text = the text in the logo ("GUR קבוצת ביטוח"), content-review Round 2 #8. Q9 still open for body text.
      - name: "גור קבוצת ביטוח"
        logo: "../../../assets/logos/customers/gur.png"
    more: "ועוד"

  # Links to the internal pages. Titles and summaries are taken from each page's own content.
  - type: links
    id: explore
    items:
      - icon: puzzle
        title: "הבעיה והפתרון"
        body: "נפרדים מעבודה עם ריבוי מערכות ומצווארי בקבוק תפעוליים."
        href: "/solution"
      - icon: product-module
        title: "יכולות ליבה: מקצה לקצה"
        body: "ניהול מסע לקוח, תפעול, שירות ו-BPM מתקדם, דשבורדים, BI וקבלת החלטות."
        href: "/capabilities"
      - icon: certified
        title: "למה נובידאה?"
        body: "Cloud-Native אמיתי, תשתית CRM מהחזקות בעולם, אבטחת מידע ופרטיות ללא פשרות וחדשנות מבוססת בינה מלאכותית."
        href: "/why-novidea"
      - icon: office-building
        title: "המטה כאן בישראל"
        body: "הנהלה, פיתוח, ליווי הטמעה ותמיכה טכנית בעברית, כאן בישראל."
        href: "/israel"
