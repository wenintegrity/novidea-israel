    more: "ועוד"

  # Links to the internal pages. Titles and summaries are taken from each page's own content.
  - type: links
    id: explore
    items:
      - icon: puzzle
        title: "הבעיה והפתרון"
        body: "נפרדים מעבודה עם ריבוי מערכות ומצווארי בקבוק תפעוליים."
        href: "/solution"
      - icon: product-module
        title: "יכולות ליבה: מקצה לקצה"
        body: "ניהול מסע לקוח, תפעול, שירות ו-BPM מתקדם, דשבורדים, BI וקבלת החלטות."
        href: "/capabilities"
      - icon: certified
        title: "למה נובידאה?"
        body: "Cloud-Native אמיתי, תשתית CRM מהחזקות בעולם, אבטחת מידע ופרטיות ללא פשרות וחדשנות מונעת בינה מלאכותית."
        href: "/why-novidea"
      - icon: office-building
