seo:
  title: "מדיניות פרטיות | נובידאה"
  description: "איזה מידע אתר נובידאה אוסף, למה, עם מי הוא משותף, איך משתמשים בעוגיות, ומה הזכויות שלכם לעיין במידע, לתקן ולמחוק אותו."

header:
  title: "מדיניות פרטיות"
  intro:
    - "עדכון אחרון: 19/11/2026"

leadCta: false

sections:
  - type: prose
    id: privacy-policy
    sections:
      - title: "כללי"
        paragraphs:
          - "מדיניות זו מסבירה איך [לעדכון: שם החברה הרשום ומספר ח.פ.] (\"נובידאה\", \"אנחנו\") אוספת מידע אישי שנמסר לנו באתר זה ומשתמשת בו. המדיניות חלה על האתר בלבד, ולא על השימוש בפלטפורמת נובידאה עצמה, שמוסדר בהסכמים עם הלקוחות."
          - "המדיניות כתובה בלשון רבים ומיועדת לכל המגדרים."

      - title: "המידע שאנחנו אוספים"
        paragraphs:
          - "כשאתם ממלאים את טופס השארת הפרטים, אנחנו מקבלים את המידע שמסרתם בטופס, למשל:"
        bullets:
          - "שם מלא"
          - "שם הסוכנות או בית הסוכן ותפקידכם"
          - "כתובת דוא״ל עסקית ומספר טלפון"
          - "גודל הסוכנות"
        after:
          - "בנוסף, בעת הגלישה נאסף מידע טכני: כתובת IP, סוג הדפדפן והמכשיר, והעמודים שבהם צפיתם. חלק מהמידע הטכני נאסף באמצעות עוגיות, רק בהתאם לבחירתכם (ראו סעיף 6)."

      - title: "למה אנחנו משתמשים במידע"
        bullets:
          - "כדי לחזור אליכם בעקבות הפנייה ולתאם שיחת היכרות והדגמה."
          - "כדי לשלוח לכם מידע על מוצרי נובידאה ועדכונים, רק אם הסכמתם לכך ובהתאם לדין. אפשר לבקש להפסיק בכל עת."
          - "כדי לתפעל את האתר, לשמור על אבטחתו ולשפר אותו."
          - "כדי לעמוד בחובות לפי דין."

      - title: "האם חובה למסור את המידע"
        paragraphs:
          - "אין חובה חוקית למסור לנו מידע. עם זאת, בלי פרטי קשר לא נוכל לחזור אליכם בעקבות הפנייה."

      - title: "עם מי המידע משותף"
        paragraphs:
          - "איננו מוכרים מידע אישי. אנחנו משתפים מידע רק עם נותני שירות שפועלים עבורנו, ורק במידה הנדרשת:"
        bullets:
          - "HubSpot: מערכת לניהול פניות ושיווק, שדרכה פועל טופס השארת הפרטים. המידע נשמר בשרתי HubSpot מחוץ לישראל."
          - "Vercel: אחסון האתר."
          - "jsDelivr: רשת להפצת קבצים, שממנה האתר טוען קובצי עיצוב. בעת טעינת האתר היא מקבלת את כתובת ה-IP שלכם."
          - "חברות בקבוצת נובידאה, לפי הצורך כדי לטפל בפנייה."
        after:
          - "חלק מנותני השירות פועלים מחוץ לישראל, ולכן המידע עשוי לעבור לחו״ל. העברה כזו נעשית בהתאם לתקנות הגנת הפרטיות (העברת מידע אל מאגרי מידע שמחוץ לגבולות המדינה), התשס״א-2001."
          - "נמסור מידע לרשויות רק אם נידרש לכך לפי דין."

      - title: "עוגיות"
        paragraphs:
          - "עוגיות הן קבצים קטנים שנשמרים בדפדפן. באתר יש שלושה סוגים:"
        bullets:
          - "עוגיות הכרחיות: נדרשות לפעולת האתר ולשמירת הבחירה שלכם לגבי עוגיות. תמיד פעילות."
          - "עוגיות ניתוח: עוזרות לנו להבין איך משתמשים באתר. פועלות רק בהסכמתכם."
          - "עוגיות שיווק וטפסים: משמשות את HubSpot להצגת טופס השארת הפרטים ולמעקב אחר פניות. פועלות רק בהסכמתכם, ולכן הטופס מוצג רק לאחר אישורן."
        after:
          - "אפשר לשנות את הבחירה בכל עת ב[הגדרות עוגיות](#cookie-settings), או בקישור \"הגדרות עוגיות\" בתחתית כל עמוד. ביטול הסכמה מוחק את העוגיות של אותו סוג."

      - title: "אבטחת מידע"
        paragraphs:
          - "אנחנו נוקטים אמצעים סבירים לאבטחת המידע, בהתאם לתקנות הגנת הפרטיות (אבטחת מידע), התשע״ז-2017. התקשורת עם האתר מוצפנת (HTTPS). עם זאת, אף מערכת אינה חסינה לחלוטין."

      - title: "כמה זמן נשמר המידע"
        paragraphs:
          - "נשמור את המידע כל עוד הוא נדרש למטרות שלשמן נאסף, ובכל מקרה לא יותר מ-[לעדכון: תקופת שמירה], אלא אם הדין מחייב לשמור אותו זמן רב יותר."

      - title: "הזכויות שלכם"
        paragraphs:
          - "לפי חוק הגנת הפרטיות, התשמ״א-1981, אתם זכאים:"
        bullets:
          - "לעיין במידע שנשמר עליכם."
          - "לבקש לתקן מידע שאינו נכון, שלם, ברור או מעודכן, או למחוק אותו."
          - "לבקש שלא נשלח לכם דברי פרסומת, ושנמחק את פרטיכם מרשימות דיוור."
        after:
          - "לפניות בנושא, כתבו אלינו לכתובת שבסעיף 10. נשיב תוך פרק הזמן הקבוע בדין."

      - title: "יצירת קשר"
        paragraphs:
          - "לשאלות ולבקשות בנושא פרטיות: [לעדכון: כתובת דוא״ל לפניות בנושא פרטיות], או בדואר: [לעדכון: כתובת למשלוח דואר]."

      - title: "שינויים במדיניות"
        paragraphs:
          - "אנחנו עשויים לעדכן מדיניות זו מעת לעת. הנוסח המעודכן יפורסם בעמוד זה, עם תאריך העדכון האחרון."
