seo:
  title: "למה נובידאה? CRM בענן, אבטחת מידע ו-AI | נובידאה"
  description: "פלטפורמת Cloud-Native אמיתית על תשתית CRM מהחזקות בעולם, אבטחת מידע (ISO, SOC 2) וחדשנות מבוססת AI. וגם: מה אומרים לקוחות נובידאה בישראל."

header:
  title: "למה נובידאה?"
  intro:
    - "מה זה אומר עבור הסוכנות שלכם?"
  picture:
    src: "../../../assets/images/why-confident.png"
    alt: "מנהל מחייך עומד בזרועות שלובות במשרד"

sections:
  - type: features
    id: advantages
    columns: 2
    surface: light
    items:
      - icon: cloud-scale
        title: "Cloud-Native אמיתי"
        body: "גישה מלאה מכל מקום ומכל מכשיר, ללא שרתים מקומיים, עם עדכוני גרסה שוטפים ואפס זמני השבתה."
      - icon: cloud-network
        title: "מוצר גלובלי המבוסס על תשתית CRM מהחזקות בעולם"
        body: "העוצמה והגמישות של Salesforce, עם התאמה עמוקה לצרכים של שוק הביטוח הישראלי."
      - icon: cloud-security
        title: "אבטחת מידע ופרטיות ללא פשרות"
        body: "עמידה בתקני אבטחת מידע בינלאומיים (ISO, SOC 2) ובתקנות הגנת הפרטיות בישראל."
      - icon: smart-ai
        title: "חדשנות מבוססת בינה מלאכותית (AI)"
        body: "אוטומציות, קיצור זמני תפעול והפקת תובנות עסקיות מבוססות נתונים."

