# /solution. Source: "תוכן לדף אתר NOVIDEA בעברית", section "הבעיה והפתרון".

seo:
  title: "הבעיה והפתרון | נובידאה"
  description: "נפרדים מעבודה עם ריבוי מערכות ומצווארי בקבוק תפעוליים. נובידאה מביאה קונספט אחר: Single Source of Truth לכל פעילות הסוכנות."

header:
  title: "נפרדים מעבודה עם ריבוי מערכות ומצווארי בקבוק תפעוליים"
  intro:
    - "במשך שנים, סוכנויות ובתי סוכן בישראל נאלצו לתמרן בין עשרות מסכים, פורטלים של יצרנים, קובצי אקסל ומערכות Legacy ישנות שאינן מתקשרות ביניהן. התוצאה: עומס תפעולי כבד, סרבול בעבודה, איבודי מידע וקושי בצמיחה."
  picture:
    src: "../../../assets/images/solution-cloud.png"
    alt: "איש מקצוע עובד מול מחשב נייד, עם סמל ענן צהוב ברקע"

sections:
  - type: text
    id: single-source-of-truth
    surface: navy
    title: "נובידאה מביאה קונספט אחר - Single Source of Truth"
    paragraphs:
      - "פלטפורמה המרכזת את כל פעילות הסוכנות, בעולמות הפנסיוניים, אלמנטריים, פיננסיים ופרט. מניהול הליד הראשוני ועד קליטת פרודוקציה, ניהול התביעה והשירות. בזכות ארכיטקטורת Open API פתוחה, המערכת מתחברת בקלות לכל כלי, פורטל או ממשק."

  - type: features
    id: modules
    title: "בנובידאה תמצאו מגוון מודולים ויכולות המותאמים לשוק הישראלי"
    columns: 3
    items:
      - icon: tech-integration
        title: "אינטגרציות מובנות לרכיבים מרכזיים באקו-סיסטם הביטוחי בישראל"
      - icon: database
        title: "ממשקים למסלקה הפנסיונית ולהר הביטוח"
        body: "חיבור ישיר למסלקה הפנסיונית ולפוליוויז לטובת שליפת נתוני הר הביטוח והעתקי הפוליסות."
      - icon: financial-analysis
        title: "מעקב אחר נתוני התשואות והחשיפות"
        body: "אינטגרציה מובנית לביטוח-נט, גמל-נט ופנסיה-נט לטובת הבאת נתוני החשיפות והתשואות מידי חודש."
      - icon: document-automation
        title: "אינטגרציה מול רשות המיסים"
        body: "שליחת טופס עזיבת עבודה בצורה אוטומטית עבור סוכנויות הסדרים."
      - icon: data-filter
        title: "קליטת פרודוקציה ויצרנים"
        body: "מנוע מתקדם וגמיש לקליטת קבצי פרודוקציה מהיצרנים בישראל."
        soonNote: "המערכת תיכנס בצורה אוטומטית לאתרי חברות הביטוח בעצמה, תוריד את קבצי הפרודוקציה ותקלוט אותם למערכת."
      - icon: browser-settings
        title: "סימולטורים וציטוטים בזמן אמת"
        body: "ממשק מובנה לסימולטור המכירה של פורמלי ולמנוע ציטוט מחירי רכב של קוואלה."
      - icon: renewals
        title: "ציטוט מחיר חידוש"
        body: "המערכת תיכנס בצורה אוטומטית לאתרי חברות הביטוח ותזין את נתוני הפוליסה לטובת הפקת ציטוט מחיר חידוש."
        soon: true
      - icon: sales-funnel
        title: "ערוצים דיגיטליים וקליטת לידים"
        body: "חיבורים ישירים לשותפים טכנולוגיים ורשתות דיגיטל להזנת לידים ופניות בזמן אמת."
      - icon: document-settings
        title: "קליטת פרודוקציה אלמנטרית"
        body: "פוליסות רכב, דירה ועסק נקלטות מקבצי חברות הביטוח לתיק הלקוח."
      - icon: dashboard
        title: "דו\"ח תמונת לקוח מקיף"
        body: "דוח מסודר על כל התיק של הלקוח."
        soonNote: "שליחה אוטומטית במייל כל חודש, רבעון, חצי שנה או שנה."
      - icon: process-cycle
        title: "מנגנון חידושים"
        body: "כל פוליסות הרכב, הדירה והעסק שמתחדשות בקרוב, עם מעקב על כל חידוש."
      - icon: checklist
        title: "כלים ייעודיים לניהול ציי רכב"
        body: "קליטת העתקי פוליסות וסנכרון תנאים מיוחדים."
      - icon: api
        title: "Open API מלא"
        body: "חיבור גמיש לכל מערכת צד-שלישי, מוקד טלפוני, פורטל לקוחות או אפליקציה ארגונית."
      - icon: org-chart
        title: "קולקטיבים"
        body: "קליטת אקסלים של קולקטיבי בריאות לטובת ניהול הפוליסות וכן העובדים ובני המשפחה ומעקב אחר סטטוס ההצטרפות שלהם."
