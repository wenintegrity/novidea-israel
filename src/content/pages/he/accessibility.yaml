# /accessibility — accessibility statement (הצהרת נגישות). DRAFT: review before relying on it.
# Required by the Equal Rights for Persons with Disabilities (Accessibility Adjustments for Service)
# Regulations, 2013, regulation 35, and Israeli Standard IS 5568. Describes only measures that are
# actually built into the site and checks that were actually run.
# TODO(verify): fill every "[לעדכון: …]" placeholder (accessibility coordinator details are mandatory).
# TODO(verify): run and record a manual screen-reader and keyboard check (NVDA, VoiceOver), then
#               update the "how we checked" section.

seo:
  title: "הצהרת נגישות | נובידאה"
  description: "איך הונגש אתר נובידאה לפי תקן ישראלי 5568 והנחיות WCAG 2.1 ברמה AA, מגבלות ידועות, ופרטי רכז הנגישות לפניות."

header:
  title: "הצהרת נגישות"
  intro:
    - "עדכון אחרון: 19/11/2026"

leadCta: false

sections:
  - type: prose
    id: accessibility-statement
    sections:
      - title: "המחויבות שלנו"
        paragraphs:
          - "נובידאה רואה חשיבות רבה במתן שירות שוויוני, מכבד ונגיש לכל האנשים, ובהם אנשים עם מוגבלות. פעלנו להנגיש את האתר בהתאם לתקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע\"ג-2013, ולתקן הישראלי ת\"י 5568, המבוסס על הנחיות WCAG, ברמת AA."

      - title: "מה עשינו כדי להנגיש את האתר"
        bullets:
          - "אפשר לנווט בכל האתר באמצעות המקלדת בלבד, עם סימון ברור של הרכיב הפעיל."
          - "קישור \"דילוג לתוכן הראשי\" בתחילת כל עמוד."
          - "מבנה כותרות היררכי ואזורים מסומנים (ניווט, תוכן ראשי, כותרת תחתונה), שמסייעים לקוראי מסך."
          - "שפת העמודים וכיוון הכתיבה (עברית, מימין לשמאל) מוגדרים כך שקוראי מסך יקריאו אותם נכון."
          - "טקסט חלופי לתמונות בעלות משמעות."
          - "ניגודיות צבעים בין טקסט לרקע לפי רמת AA."
          - "אפשר להגדיל את הטקסט עד 200% בלי לאבד תוכן, והאתר מותאם למסכים בכל הגדלים: נייד, טאבלט ומחשב."
          - "האנימציות באתר מתבטלות כשבמערכת ההפעלה מופעלת ההגדרה \"הפחתת תנועה\"."
          - "ההנגשה מובנית בקוד האתר. איננו משתמשים בתוסף נגישות חיצוני."

      - title: "איך בדקנו"
        paragraphs:
          - "כל עמודי האתר נבדקים בבדיקות אוטומטיות בכלי axe, בשלושה גדלי מסך (נייד, טאבלט ומחשב), בדפדפן Chrome, לפני כל פרסום של גרסה חדשה. נבדקים גם ניווט במקלדת, תפריט הנייד וחלון הגדרות העוגיות."
          - "[לעדכון: תוצאות בדיקה ידנית עם קורא מסך (NVDA ו-VoiceOver) ותאריך הבדיקה]"

      - title: "מגבלות ידועות"
        bullets:
          - "טופס השארת הפרטים מופעל על ידי HubSpot, ספק חיצוני, ומוצג רק לאחר אישור עוגיות שיווק וטפסים. רמת הנגישות של הטופס תלויה בספק. אם נתקלתם בקושי למלא את הטופס, אפשר לפנות אלינו ישירות בפרטים שבסעיף 5, ונחזור אליכם."
        after:
          - "למרות מאמצינו, ייתכן שחלקים באתר עדיין אינם נגישים במלואם. נשמח לשמוע על כל קושי."

      - title: "רכז הנגישות"
        paragraphs:
          - "נתקלתם בבעיית נגישות, או שיש לכם הצעה לשיפור? נשמח לעזור:"
        bullets:
          - "רכז/ת הנגישות: [לעדכון: שם]"
          - "טלפון: [לעדכון: מספר טלפון]"
          - "דוא\"ל: [לעדכון: כתובת דוא\"ל]"
          - "כתובת: [לעדכון: כתובת למשלוח דואר]"
        after:
          - "כדי שנוכל לטפל בפנייה, נשמח לקבל תיאור של הבעיה, את כתובת העמוד ואת הדפדפן וטכנולוגיית העזר שבהם השתמשתם."

      - title: "עדכון ההצהרה"
        paragraphs:
          - "הצהרה זו עודכנה לאחרונה ב-19/11/2026, ותעודכן עם כל שינוי מהותי באתר."
