# SEO title and description: docs/seo.md §4.1 (approved 20/11/2026).
seo:
  title: "תיאום הדגמה למערכת לסוכנויות ביטוח | נובידאה"
  description: "השאירו פרטים לשיחת היכרות והדגמה של נובידאה, מערכת הענן לניהול סוכנויות ביטוח ובתי סוכן. הצוות שלנו יחזור אליכם."

header:
  title: "מוכנים להוביל את הסוכנות לעידן הבא?"
  intro:
    - "הצטרפו לסוכנויות המובילות בישראל שמנהלות את תיק הלקוחות שלהן וצומחות בנובידאה. השאירו פרטים והצוות שלנו יחזור אליכם לשיחת היכרות והדגמה."
  picture:
    src: "../../../assets/images/product-dashboards.png"
    alt: "דשבורדים של מערכת נובידאה על מסך מחשב"

leadCta: false

sections:
  - type: leadForm
    id: lead-form
    hubspot:
      portalId: "2799426"
      formId: "05171e84-3123-41fc-81e0-3f8626cb3574"
      region: "na1"
    # Fields the HubSpot form should have (from the content document), for reference; shown only if
    # the hubspot settings above are removed. "100+" is isolated as LTR.
    fields:
      - "שם מלא"
      - "שם הסוכנות / בית הסוכן"
      - "תפקיד (מנכ״ל / סמנכ״ל תפעול / מנהל מערכות מידע / אחר)"
      - "דוא״ל עסקי"
      - "טלפון"
      - "גודל הסוכנות (10-30 משתמשים / 30-100 משתמשים / ⁦100+⁩ משתמשים)"

