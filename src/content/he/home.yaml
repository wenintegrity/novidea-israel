# Home page: Hebrew
# Model: docs/content-model.md (page type "home")
#
# Sources:
#   [AD25] Novidea ad, Polisa digital issue, Insurance Agents Conference 2025 (approved marketing copy)
#   [AD23] Novidea ad, Polisa 2023 (approved marketing copy)
#   [PR]   Novidea press release, Israel customer conference, 07/07/2026
#   [PRC]  Novidea press release, Colmobil chooses Novidea, 29/12/2025
#
# Anything not fully supported by a source is marked TODO(verify) and must not ship.

seo:
  title: "Novidea | לנהל ביטוח. לחשוב הייטק."
  description: "Novidea: פלטפורמה מונחת נתונים לניהול סוכנויות ביטוח. כל המידע על הלקוח במקום אחד, אוטומציה של תהליכי עבודה ותובנות AI לצמיחה עסקית."

hero:
  # Source: [AD25] [AD23] headline and subline, verbatim.
  titleStrong: "לנהל ביטוח."
  titleRest: "לחשוב הייטק."
  lead: "הצטרפו למהפכה הדיגיטלית עם Novidea, פלטפורמה מונחת נתונים (Data-driven) לניהול סוכנויות ביטוח."
  # Source: [AD25] bullets, verbatim.
  points:
    - "ניהול המידע על הלקוח מקצה לקצה, במקום אחד"
    - "מינוף המידע לטובת צמיחה במכירות, הגדלת הרווחיות ויעילות תפעולית"
    - "מיכון תהליכי עבודה בהתאם לצרכי החברה"
  primaryCta:
    label: "לתיאום הדגמה"
    href: "#contact"
  secondaryCta:
    label: "להכיר את הפלטפורמה"
    href: "#platform"
  # Brand key visual (src/assets/brand/Group 1274.png, transparent margins trimmed).
  picture:
    src: "../../assets/images/hero-empower-your-people.png"
    alt: "אשת מקצוע מחייכת במשרד מודרני, עם פסי המותג הצהובים של Novidea"

pillars:
  # Source: [PR] "three main axes" presented by the product team.
  title: "פלטפורמה אחת לכל עבודת הסוכנות"
  intro: "שלושה עקרונות מנחים את הפיתוח של Novidea:"
  items:
    - icon: dashboard
      title: "מידע פשוט ונגיש"
      body: "כל המידע שהסוכן צריך מרוכז ומוצג בצורה ברורה, בלי לחפש בין מערכות."
    - icon: process-cycle
      title: "אוטומציה של תהליכי הליבה"
      body: "ניהול מחזור חיי הפוליסה ומסע המבוטח באופן אוטומטי, ליעילות תפעולית גבוהה יותר."
    - icon: idea
      title: "תובנות לחוויית לקוח טובה יותר"
      body: "תובנות מבוססות מידע שעוזרות לסוכן לתת לכל לקוח שירות מדויק ואישי."

results:
  # Source: [AD25] red band, verbatim; "ובקשות שירות" and "ותיקי ביטוח" from [AD23].
  title: "לקוחותינו מציגים גידול של עשרות אחוזים בתחומים הבאים:"
  items:
    - "מכירות צולבות"
    - "מכירת פוליסות"
    - "חידושים"
    - "טיפול בתביעות ובקשות שירות"
    - "יעילות תפעולית"
    - "מיזוג סוכנויות ותיקי ביטוח"

spotlight:
  # Source: [PR] new version of the "Customer view" module, shown in a live demo.
  # TODO(verify): is the new version generally available, or was it a preview? Adjust the eyebrow if not released.
  eyebrow: "חדש: מודול תמונת לקוח"
  title: "כל הלקוח במסך אחד"
  body: "תצוגה מרוכזת וחכמה של כל מה שהסוכן צריך לדעת על הלקוח, כדי להכין כל שיחה בתוך דקות."
  points:
    - "כל הנכסים של הלקוח"
    - "החסכונות וההשקעות"
    - "הכיסויים הביטוחיים הקיימים"
  # Product picture (src/assets/brand/Group 1366.png). It shows general Novidea dashboards.
  # TODO(verify): replace with a screenshot of the customer view module itself once marketing supplies one.
  picture:
    src: "../../assets/images/product-dashboards.png"
    alt: "לוחות מחוונים של מערכת Novidea על מסך מחשב"

ai:
  # Source: [PR] "first look" at AI capabilities. They were previewed, not released, so the badge says so.
  # [AD25] "אפשרות לניצול יכולות AI להפקת תובנות וצמיחה עסקית".
  badge: "הצצה ראשונה"
  title: "בינה מלאכותית שמעצימה את הסוכן, לא מחליפה אותו"
  body: "Novidea מפתחת יכולות AI להפקת תובנות וצמיחה עסקית, שיהפכו לעוזר החכם של סוכן הביטוח. בלחיצת כפתור:"
  items:
    - icon: checklist
      title: "סיכום תיק הלקוח"
      body: "סיכום אוטומטי של כל המידע על הלקוח, מוכן לפני כל שיחה."
    - icon: online-support
      title: "פיץ' מותאם אישית"
      body: "נקודות שיחה שנבנות במיוחד עבור הלקוח והשיחה הבאה איתו."
    - icon: analytics-search
      title: "איתור חוסרים והזדמנויות"
      body: "סריקה יזומה של התיק לאיתור פערים בכיסוי והזדמנויות מכירה."
  # src/assets/brand/Group 1326.png, transparent margins trimmed.
  picture:
    src: "../../assets/images/agent-at-laptop.png"
    alt: "איש מקצוע מחייך עובד מול מחשב נייד"

story:
  # Source: [PRC]. Facts and the quote are taken from the release; the quote is verbatim.
  eyebrow: "סיפור לקוח"
  title: "כלמוביל מאחדת מכירות וביטוח בפלטפורמה אחת"
  body: "כלמוביל, יבואנית הרכב הגדולה בישראל, הפעילה עד היום מערכות נפרדות לניהול המכירות ולניהול הביטוח. היא בחרה ב-Novidea בזכות היכולת לנהל את מסע המבוטח ומחזור חיי הפוליסה, ולהתממשק ישירות למערכת ניהול הלקוחות הקיימת שלה, המבוססת Salesforce."
  points:
    - "רצף עבודה אחיד בין המכירות והביטוח"
    - "אוטומציה במכירות, בשירות, בתפעול ובתביעות"
    - "בקרות על איכות המידע ותובנות בזמן אמת"
  quote:
    text: "בזכות שילוב מערכות המכירות והביטוח שלנו לפלטפורמה אחידה אחת, נשפר את היעילות התפעולית ונשיג את יכולות הניהול הנדרשות לצמיחה המתמשכת שלנו."
    name: "אילן שפירו"
    role: "מנכ״ל סוכנות הביטוח בכלמוביל"
  # TODO(verify): confirm Colmobil approved use of its name, logo and this quote on the website (beyond the press release).

audiences:
  # Source: [PRC] intro: insurance agencies, brokers, insurers and MGUs/MGAs.
  title: "למי זה מתאים"
  items:
    - icon: people-exchange
      title: "סוכנויות ביטוח"
      body: "ניהול הלקוחות, הפוליסות והתפעול של הסוכנות במערכת אחת."
    - icon: partnership
      title: "ברוקרים"
      body: "שליטה מלאה בתיקי הלקוחות ובתהליכי ההפצה, מכל מקום."
    - icon: protection
      title: "חברות ביטוח"
      body: "מערכת ליבה מבוססת ענן לניהול ההפצה והקשר עם הסוכנים."
    - icon: business-performance
      title: "MGA / MGU"
      body: "חיתום, הנפקה וניהול פוליסות בפלטפורמה גמישה שגדלה איתכם."

